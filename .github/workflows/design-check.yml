name: Design check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-design:
    name: check:design
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Same as `npm run check:design`. The script only uses Node built-ins,
      # so it runs through npx without installing the app's dependencies.
      - run: npx --yes tsx@4.22.4 scripts/check-design.ts
